name: Validate skills

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Fetch index.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern index.json --dir previous || echo "No previous release."

      - name: Validate skills and version bumps
        run: node tooling/build.mjs --previous previous/index.json
