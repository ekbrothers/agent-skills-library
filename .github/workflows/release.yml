name: Release skills

# Every push to main that changes skill content publishes a new GitHub Release
# holding index.json plus one archive per skill. The Prompt Library extension
# reads index.json from the latest release.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'tooling/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Fetch index.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern index.json --dir previous || echo "No previous release."

      - name: Build
        run: node tooling/build.mjs --previous previous/index.json

      - name: Publish release
        if: hashFiles('dist/unchanged') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="content-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.tar.gz dist/index.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Skills $tag" \
            --notes-file dist/release-notes.md \
            --latest

      - name: Nothing to release
        if: hashFiles('dist/unchanged') != ''
        run: echo "Skill content is identical to the latest release. No release created."
